/* ============================================================
   SITE CODE. You shouldn't need to change anything below.
   Addresses: #w-2 = second work, #w-2-c-3 = its third chapter.
   ============================================================ */
const app = document.getElementById("app");

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}
function link(href, cls, text) {
  const a = el("a", cls, text);
  a.href = href;
  return a;
}
function lastKey(w) { return "archive-last-" + w; }
function lastRead(w) {
  try { return parseInt(localStorage.getItem(lastKey(w)), 10); } catch (e) { return NaN; }
}
function saveLast(w, c) {
  try { localStorage.setItem(lastKey(w), String(c)); } catch (e) {}
}
function metaLine(work) {
  const n = work.chapters.length;
  return work.status + " · " + n + (n === 1 ? " chapter" : " chapters");
}

function showHome() {
  document.title = "Pure’s Archive";
  app.replaceChildren();
  const head = el("header", "masthead");
  head.append(el("h1", "", ARCHIVE.title));
  ARCHIVE.intro.forEach(t => head.append(el("p", "", t)));
  app.append(head);

  app.append(el("h2", "section-title", "Works"));
  WORKS.forEach((w, i) => {
    const a = link("#w-" + (i + 1), "work");
    a.append(el("span", "title", w.title), el("span", "meta", metaLine(w)));
    if (w.summary) a.append(el("span", "sum", w.summary));
    app.append(a);
  });
}

function showWork(wi) {
  const w = WORKS[wi];
  document.title = w.title + " · Pure’s Archive";
  app.replaceChildren();

  const top = el("div", "topbar");
  top.append(link("#", "", "Archive home"));
  app.append(top);

  const head = el("header", "work-head");
  head.append(el("h1", "", w.title), el("p", "meta", metaLine(w)));
  if (w.summary) head.append(el("p", "", w.summary));
  const last = lastRead(wi);
  if (Number.isInteger(last) && w.chapters[last]) {
    head.append(link("#w-" + (wi + 1) + "-c-" + (last + 1), "resume", "Continue reading: " + w.chapters[last].title));
  }
  app.append(head);

  app.append(el("h2", "section-title", "Table of contents"));
  if (!w.chapters.length) {
    app.append(el("p", "empty", "No chapters posted yet."));
    return;
  }
  const list = el("ul", "toc");
  let currentPart = null;
  w.chapters.forEach((c, i) => {
    if (c.part && c.part !== currentPart) {
      currentPart = c.part;
      list.append(el("li", "part", c.part));
    }
    const li = el("li");
    const a = link("#w-" + (wi + 1) + "-c-" + (i + 1), "");
    a.append(el("span", "num", "Chapter " + (i + 1)), el("span", "title", c.title));
    if (c.summary) a.append(el("span", "sum", c.summary));
    li.append(a);
    list.append(li);
  });
  app.append(list);
}

function showChapter(wi, ci) {
  const w = WORKS[wi];
  const c = w.chapters[ci];
  const base = "#w-" + (wi + 1);
  document.title = c.title + " · " + (w.short || w.title);
  saveLast(wi, ci);
  app.replaceChildren();

  const top = el("div", "topbar");
  top.append(link(base, "", "Contents"), el("span", "", (w.short || w.title) + " · " + (ci + 1) + " of " + w.chapters.length));
  app.append(top);

  const head = el("header", "chapter-head");
  if (c.part) head.append(el("div", "num", c.part));
  head.append(el("h1", "", c.title));
  app.append(head);

  const prose = el("article", "prose");
  c.text.trim().split(/\n\s*\n/).forEach(block => {
    const t = block.trim();
    if (!t) return;
    if (/^(\*\s*){3,}$/.test(t)) prose.append(el("div", "break", "***"));
    else prose.append(el("p", "", t.replace(/\n/g, " ")));
  });
  app.append(prose);

  const pager = el("nav", "pager");
  pager.setAttribute("aria-label", "Chapter navigation");
  const prev = ci > 0 ? link(base + "-c-" + ci, "prev", "Previous") : el("span", "off", "Previous");
  const next = ci < w.chapters.length - 1 ? link(base + "-c-" + (ci + 2), "next", "Next") : el("span", "next off", "Next");
  pager.append(prev, link(base, "", "Contents"), next);
  app.append(pager);
}

function route() {
  const hash = location.hash.slice(1);
  const m = /^w-(\d+)(?:-c-(\d+))?$/.exec(hash);
  if (m) {
    const wi = parseInt(m[1], 10) - 1;
    if (WORKS[wi]) {
      if (m[2]) {
        const ci = parseInt(m[2], 10) - 1;
        if (WORKS[wi].chapters[ci]) { showChapter(wi, ci); window.scrollTo(0, 0); return; }
      }
      showWork(wi); window.scrollTo(0, 0); return;
    }
  }
  showHome();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
