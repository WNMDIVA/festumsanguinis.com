<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pure’s Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0b0e;
  --surface: #17131a;
  --line: #2c2430;
  --text: #e9e1d6;
  --muted: #9a8f9c;
  --accent: #b3283d;
  --accent-soft: #d46a7a;
  --display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --body: "Source Serif 4", Georgia, "Times New Roman", serif;
  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--body); font-size: 1.125rem; line-height: 1.75; }
main { max-width: 38rem; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent-soft); outline-offset: 3px; }

.masthead { padding: 3rem 0 2.5rem; border-bottom: 1px solid var(--line); }
.masthead h1 { font-family: var(--display); font-weight: 700; font-size: clamp(2.6rem, 11vw, 4.4rem); line-height: 1.02; margin: 0 0 1rem; }
.masthead p { margin: 0 0 .75rem; color: var(--muted); }
.section-title { font-family: var(--display); font-size: 1.9rem; margin: 2.5rem 0 .5rem; }

.work { display: block; padding: 1.4rem 0; border-bottom: 1px solid var(--line); text-decoration: none; }
.work .title { font-family: var(--display); font-size: 1.75rem; font-weight: 700; line-height: 1.2; display: block; }
.work .meta { display: block; font-size: .95rem; color: var(--accent-soft); margin-top: .3rem; }
.work .sum { display: block; color: var(--muted); font-size: 1rem; line-height: 1.55; margin-top: .4rem; }
.work:hover .title { color: var(--accent-soft); }

.work-head { padding: 1.5rem 0 1.5rem; border-bottom: 1px solid var(--line); }
.work-head h1 { font-family: var(--display); font-size: clamp(2.1rem, 8vw, 3rem); line-height: 1.12; margin: 0 0 .5rem; }
.work-head .meta { color: var(--accent-soft); font-size: .95rem; margin: 0 0 1rem; }
.work-head p { margin: 0; color: var(--muted); }
.resume { display: inline-block; margin-top: 1.25rem; padding: .6rem 1.1rem; border: 1px solid var(--accent); text-decoration: none; font-size: 1rem; }
.resume:hover { background: var(--accent); }

.toc { list-style: none; margin: 0; padding: 0; }
.part { font-family: var(--display); font-size: 1.5rem; font-weight: 700; color: var(--accent-soft); margin: 2rem 0 .25rem; }
.toc li a { display: block; padding: 1rem 0; border-bottom: 1px solid var(--line); text-decoration: none; }
.toc .num { display: block; font-size: .9rem; color: var(--muted); }
.toc .title { font-family: var(--display); font-size: 1.5rem; font-weight: 700; line-height: 1.2; }
.toc .sum { display: block; color: var(--muted); font-size: 1rem; line-height: 1.5; margin-top: .25rem; }
.toc li a:hover .title { color: var(--accent-soft); }
.empty { color: var(--muted); font-style: italic; margin-top: 1.5rem; }

.topbar { display: flex; justify-content: space-between; gap: 1rem; font-size: .95rem; color: var(--muted); }
.topbar a { text-decoration: none; }
.topbar a:hover { color: var(--text); }

.chapter-head { margin: 1rem 0 2.5rem; }
.chapter-head .num { color: var(--muted); font-size: .95rem; }
.chapter-head h1 { font-family: var(--display); font-size: clamp(2.2rem, 9vw, 3.2rem); line-height: 1.1; margin: .25rem 0 0; }
.prose p { margin: 0 0 1.3em; }
.prose p:first-child::first-letter { font-family: var(--display); font-size: 3.6em; float: left; line-height: .85; padding: .08em .1em 0 0; color: var(--accent-soft); }
.prose .break { text-align: center; color: var(--accent); letter-spacing: .6em; margin: 2em 0; }

.pager { display: grid; grid-template-columns: 1fr auto 1fr; gap: .75rem; align-items: center; margin-top: 3.5rem; padding-top: 1.5rem; border-top: 1px solid var(--line); font-size: 1rem; }
.pager a { text-decoration: none; padding: .5rem 0; }
.pager .next { text-align: right; }
.pager a:hover { color: var(--accent-soft); }
.pager .off { visibility: hidden; }

footer { max-width: 38rem; margin: 0 auto; padding: 0 1.25rem 2.5rem; color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
<main id="app"></main>
<footer>© 2026 Pure. All rights reserved.</footer>

<script>
/* ============================================================
   EDIT THIS PART
   ------------------------------------------------------------
   ARCHIVE: the welcome text on the first page.

   WORKS: each fic or AU is one { ... }, block. To add a new
   work, copy a whole block, paste it after the last one, and
   change the text.
     status: "In progress", "Complete", "On hiatus", etc.

   CHAPTERS (inside each work): to add a chapter, copy one
   { ... }, block and paste it at the end of that work's list.
     - Blank line between paragraphs.
     - A line with only *** makes a scene break.
     - "part" is optional and groups chapters in the list.
   ============================================================ */
const ARCHIVE = {
  title: "Welcome to Pure’s Archive!",
  intro: [
    "This is where I keep my fanfics, AUs, and other writing. Pick a work below to see its chapters.",
    "New chapters go up as I finish them, so check back often."
  ]
};

const WORKS = [
  {
    title: "Surely Don’t Stay Long, I’m Missing You Now",
    short: "SDSLIMYN",
    status: "In progress",
    summary: "Replace this with a short description of the fic.",
    chapters: [
      {
        title: "Chapter One",
        summary: "Optional teaser for this chapter.",
        text: `Paste your first chapter here. Keep a blank line between paragraphs, like this.

This is the second paragraph. The drop cap on the first letter is added automatically.

***

Three asterisks on their own line become a scene break.`
      },
      {
        title: "Chapter Two",
        summary: "Optional teaser for this chapter.",
        text: `Chapter two text goes here.`
      }
    ]
  }
];

/* ============================================================
   SITE CODE. You shouldn't need to change anything below.
   Addresses: #w-2 = second work, #w-2-c-3 = its third chapter.
   ============================================================ */
const app = document.getElementById("app");

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}
function link(href, cls, text) {
  const a = el("a", cls, text);
  a.href = href;
  return a;
}
function lastKey(w) { return "archive-last-" + w; }
function lastRead(w) {
  try { return parseInt(localStorage.getItem(lastKey(w)), 10); } catch (e) { return NaN; }
}
function saveLast(w, c) {
  try { localStorage.setItem(lastKey(w), String(c)); } catch (e) {}
}
function metaLine(work) {
  const n = work.chapters.length;
  return work.status + " · " + n + (n === 1 ? " chapter" : " chapters");
}

function showHome() {
  document.title = "Pure’s Archive";
  app.replaceChildren();
  const head = el("header", "masthead");
  head.append(el("h1", "", ARCHIVE.title));
  ARCHIVE.intro.forEach(t => head.append(el("p", "", t)));
  app.append(head);

  app.append(el("h2", "section-title", "Works"));
  WORKS.forEach((w, i) => {
    const a = link("#w-" + (i + 1), "work");
    a.append(el("span", "title", w.title), el("span", "meta", metaLine(w)));
    if (w.summary) a.append(el("span", "sum", w.summary));
    app.append(a);
  });
}

function showWork(wi) {
  const w = WORKS[wi];
  document.title = w.title + " · Pure’s Archive";
  app.replaceChildren();

  const top = el("div", "topbar");
  top.append(link("#", "", "Archive home"));
  app.append(top);

  const head = el("header", "work-head");
  head.append(el("h1", "", w.title), el("p", "meta", metaLine(w)));
  if (w.summary) head.append(el("p", "", w.summary));
  const last = lastRead(wi);
  if (Number.isInteger(last) && w.chapters[last]) {
    head.append(link("#w-" + (wi + 1) + "-c-" + (last + 1), "resume", "Continue reading: " + w.chapters[last].title));
  }
  app.append(head);

  app.append(el("h2", "section-title", "Table of contents"));
  if (!w.chapters.length) {
    app.append(el("p", "empty", "No chapters posted yet."));
    return;
  }
  const list = el("ul", "toc");
  let currentPart = null;
  w.chapters.forEach((c, i) => {
    if (c.part && c.part !== currentPart) {
      currentPart = c.part;
      list.append(el("li", "part", c.part));
    }
    const li = el("li");
    const a = link("#w-" + (wi + 1) + "-c-" + (i + 1), "");
    a.append(el("span", "num", "Chapter " + (i + 1)), el("span", "title", c.title));
    if (c.summary) a.append(el("span", "sum", c.summary));
    li.append(a);
    list.append(li);
  });
  app.append(list);
}

function showChapter(wi, ci) {
  const w = WORKS[wi];
  const c = w.chapters[ci];
  const base = "#w-" + (wi + 1);
  document.title = c.title + " · " + (w.short || w.title);
  saveLast(wi, ci);
  app.replaceChildren();

  const top = el("div", "topbar");
  top.append(link(base, "", "Contents"), el("span", "", (w.short || w.title) + " · " + (ci + 1) + " of " + w.chapters.length));
  app.append(top);

  const head = el("header", "chapter-head");
  if (c.part) head.append(el("div", "num", c.part));
  head.append(el("h1", "", c.title));
  app.append(head);

  const prose = el("article", "prose");
  c.text.trim().split(/\n\s*\n/).forEach(block => {
    const t = block.trim();
    if (!t) return;
    if (/^(\*\s*){3,}$/.test(t)) prose.append(el("div", "break", "***"));
    else prose.append(el("p", "", t.replace(/\n/g, " ")));
  });
  app.append(prose);

  const pager = el("nav", "pager");
  pager.setAttribute("aria-label", "Chapter navigation");
  const prev = ci > 0 ? link(base + "-c-" + ci, "prev", "Previous") : el("span", "off", "Previous");
  const next = ci < w.chapters.length - 1 ? link(base + "-c-" + (ci + 2), "next", "Next") : el("span", "next off", "Next");
  pager.append(prev, link(base, "", "Contents"), next);
  app.append(pager);
}

function route() {
  const hash = location.hash.slice(1);
  const m = /^w-(\d+)(?:-c-(\d+))?$/.exec(hash);
  if (m) {
    const wi = parseInt(m[1], 10) - 1;
    if (WORKS[wi]) {
      if (m[2]) {
        const ci = parseInt(m[2], 10) - 1;
        if (WORKS[wi].chapters[ci]) { showChapter(wi, ci); window.scrollTo(0, 0); return; }
      }
      showWork(wi); window.scrollTo(0, 0); return;
    }
  }
  showHome();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
